name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

permissions:
  contents: read
  packages: admin
  attestations: write
  id-token: write

jobs:
  # ===== 后端测试 =====
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Lint 检查
        run: |
          flake8 backend/ || true
          black --check backend/ || true
          isort --check backend/ || true

      - name: 单元测试
        run: pytest -m "not docker and not slow" --cov=backend

  # ===== 前端测试 =====
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      - name: 代码检查
        run: npm run lint

      - name: 单元测试
        run: npm run test

  # ===== 构建推送 + 触发 GitLab（仅 main 分支 push） =====
  build-push:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- 后端镜像 ----
      - name: 提取后端镜像元数据
        id: meta-backend
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送后端镜像
        id: push-backend
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: 生成后端镜像 attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.push-backend.outputs.digest }}
          push-to-registry: true

      # 将后端镜像包设为 public（幂等：仅在非 public 时执行；public 后无法改回 private）
      - name: 设置后端镜像包可见性为 public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORG="${GITHUB_REPOSITORY_OWNER,,}"
          # GHCR 包名 = 仓库名/镜像名，斜杠需编码为 %2F
          REPO="${GITHUB_REPOSITORY#*/}"
          PKG="${REPO,,}%2Fbackend"
          STATUS="$(gh api "/orgs/${ORG}/packages/container/${PKG}" --jq .visibility 2>/dev/null || echo unknown)"
          echo "当前可见性: ${STATUS}"
          if [ "${STATUS}" != "public" ]; then
            gh api --method PATCH "/orgs/${ORG}/packages/container/${PKG}/visibility" -f visibility=public
            echo "✓ 已设置为 public"
          else
            echo "✓ 已经是 public，跳过"
          fi

      # ---- 前端镜像 ----
      - name: 提取前端镜像元数据
        id: meta-frontend
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送前端镜像
        id: push-frontend
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: 生成前端镜像 attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.push-frontend.outputs.digest }}
          push-to-registry: true

      # 将前端镜像包设为 public（幂等：仅在非 public 时执行；public 后无法改回 private）
      - name: 设置前端镜像包可见性为 public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORG="${GITHUB_REPOSITORY_OWNER,,}"
          # GHCR 包名 = 仓库名/镜像名，斜杠需编码为 %2F
          REPO="${GITHUB_REPOSITORY#*/}"
          PKG="${REPO,,}%2Ffrontend"
          STATUS="$(gh api "/orgs/${ORG}/packages/container/${PKG}" --jq .visibility 2>/dev/null || echo unknown)"
          echo "当前可见性: ${STATUS}"
          if [ "${STATUS}" != "public" ]; then
            gh api --method PATCH "/orgs/${ORG}/packages/container/${PKG}/visibility" -f visibility=public
            echo "✓ 已设置为 public"
          else
            echo "✓ 已经是 public，跳过"
          fi

      # ---- 触发 GitLab CI ----
