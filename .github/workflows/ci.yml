name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_NAMESPACE: joblens
  BACKEND_IMAGE: joblens-webmanager-backend
  FRONTEND_IMAGE: joblens-webmanager-frontend

jobs:
  # ===== 后端测试 =====
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Lint 检查
        run: |
          flake8 backend/ || true
          black --check backend/ || true
          isort --check backend/ || true

      - name: 单元测试
        run: pytest -m "not docker and not slow" --cov=backend

  # ===== 前端测试 =====
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      - name: 代码检查
        run: npm run lint

      - name: 单元测试
        run: npm run test

  # ===== 构建推送 + 触发 GitLab（仅 main 分支 push） =====
  build-push:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 验证登录状态
        run: |
          docker info --format '已登录用户: {{ .RegistryConfig.IndexConfigs }}' 2>&1 || true
          echo "目标仓库: $DOCKERHUB_NAMESPACE/$BACKEND_IMAGE"
          echo "目标仓库: $DOCKERHUB_NAMESPACE/$FRONTEND_IMAGE"

      - name: 获取短 SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ steps.sha.outputs.short }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${{ steps.sha.outputs.short }}

      - name: 触发 GitLab CI
        run: |
          export GITLAB_TOKEN="${{ secrets.GITLAB_TRIGGER_TOKEN }}"
          export GITLAB_PROJECT_ID="${{ secrets.GITLAB_PROJECT_ID }}"
          chmod +x scripts/trigger-gitlab.sh
          ./scripts/trigger-gitlab.sh main
