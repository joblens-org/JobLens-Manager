[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    --tb=short
    --strict-markers
    --disable-warnings
    -v
    -m "not docker"
    --cov=backend
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: 单元测试
    integration: 集成测试
    api: API测试
    service: 服务层测试
    slow: 慢速测试（需要外部依赖）
    docker: 需要Docker环境的测试